<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 184" role="img" aria-labelledby="title desc">
  <title id="title">SignalWeave</title>
  <desc id="desc">The SignalWeave mark: three connected signal strands beside the product name.</desc>
  <style>
    .wordmark { fill: #101828; font: 700 58px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -2px; }
    .tagline { fill: #667085; font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #f8fafc; }
      .tagline { fill: #98a2b3; }
    }
  </style>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12b8a6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="signalWarm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f79009"/>
      <stop offset="1" stop-color="#ec4a9d"/>
    </linearGradient>
  </defs>
  <rect width="720" height="184" rx="22" fill="#ffffff"/>
  <g transform="translate(22 22)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 93 C34 40 62 40 82 93 S130 146 150 93" stroke="url(#signal)" stroke-width="16"/>
    <path d="M14 93 C34 146 62 146 82 93 S130 40 150 93" stroke="url(#signalWarm)" stroke-width="16"/>
    <path d="M14 93 H150" stroke="#101828" stroke-opacity=".16" stroke-width="8"/>
    <circle cx="14" cy="93" r="8" fill="#101828" stroke="none"/>
    <circle cx="150" cy="93" r="8" fill="#101828" stroke="none"/>
  </g>
  <text class="wordmark" x="202" y="103">SignalWeave</text>
  <text class="tagline" x="207" y="137">EVIDENCE · JUDGMENT · ACTION</text>
</svg>
