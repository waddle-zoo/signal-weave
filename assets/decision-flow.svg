<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">SignalWeave agent workflow</title>
  <desc id="desc">An agent and owner review a reusable card, SignalWeave fetches its approved sources, and returns evidence to the agent for analysis.</desc>
  <style>
    .label { fill: #101828; font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .detail { fill: #667085; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .arrow { stroke: #98a2b3; stroke-width: 3; fill: none; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f8fafc; }
      .detail { fill: #98a2b3; }
      .arrow { stroke: #667085; }
    }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff8ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="sources" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfdf3"/><stop offset="1" stop-color="#d1fae5"/></linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdf2fa"/><stop offset="1" stop-color="#fce7f3"/></linearGradient>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#98a2b3"/></marker>
  </defs>
  <rect width="960" height="230" rx="28" fill="#ffffff"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M286 115 H336"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M606 115 H656"/>
  <g transform="translate(24 35)">
    <rect width="262" height="160" rx="20" fill="url(#card)" stroke="#2e90fa" stroke-opacity=".35"/>
    <text class="label" x="24" y="48">Reviewed card</text>
    <text class="detail" x="24" y="83">Intent · exact source refs</text>
    <text class="detail" x="24" y="108">Questions · owner context</text>
    <text class="detail" x="24" y="138">Saved once, reused</text>
  </g>
  <g transform="translate(349 35)">
    <rect width="257" height="160" rx="20" fill="url(#sources)" stroke="#12b76a" stroke-opacity=".35"/>
    <text class="label" x="24" y="48">Fresh evidence</text>
    <text class="detail" x="24" y="83">Only approved sources</text>
    <text class="detail" x="24" y="108">Snapshots · provenance</text>
    <text class="detail" x="24" y="138">Gaps returned, not hidden</text>
  </g>
  <g transform="translate(656 35)">
    <rect width="280" height="160" rx="20" fill="url(#agent)" stroke="#ec4a9d" stroke-opacity=".35"/>
    <text class="label" x="24" y="48">Your agent</text>
    <text class="detail" x="24" y="83">Analyzes · explains</text>
    <text class="detail" x="24" y="108">Investigates · follows up</text>
    <text class="detail" x="24" y="138">Schedules · delivers</text>
  </g>
</svg>
