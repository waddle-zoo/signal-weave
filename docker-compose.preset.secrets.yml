services:
  signal-weave:
    environment:
      # Override any direct values from .env.preset. The runtime reads these
      # files into the short-lived provider client and never persists them.
      PRESET_API_TOKEN_NAME: ""
      PRESET_API_TOKEN_SECRET: ""
      PRESET_API_TOKEN_NAME_FILE: /run/secrets/preset_api_token_name
      PRESET_API_TOKEN_SECRET_FILE: /run/secrets/preset_api_token_secret
    secrets:
      - preset_api_token_name
      - preset_api_token_secret

secrets:
  preset_api_token_name:
    file: ${PRESET_API_TOKEN_NAME_HOST_FILE:?Set PRESET_API_TOKEN_NAME_HOST_FILE to the mounted secret path}
  preset_api_token_secret:
    file: ${PRESET_API_TOKEN_SECRET_HOST_FILE:?Set PRESET_API_TOKEN_SECRET_HOST_FILE to the mounted secret path}
