services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  superset:
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: local-only-change-me
      DATABASE_DB: superset
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: superset
      DATABASE_USER: superset
      DATABASE_PORT: 5432
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./docker/superset/bootstrap.sh:/app/pythonpath/bootstrap.sh:ro
      - superset_home:/app/superset_home
    ports:
      - "8088:8088"
    command: ["/bin/sh", "/app/pythonpath/bootstrap.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  monitor:
    build: .
    depends_on:
      superset:
        condition: service_healthy
    environment:
      MONITOR_SOURCE: ${MONITOR_SOURCE:-superset}
      TYPESAFE_MODE: ${TYPESAFE_MODE:-heuristic}
      TYPESAFE_API_KEY_FILE: /run/secrets/typesafe_api_key
      SUPERSET_URL: http://superset:8088
      SUPERSET_USERNAME: admin
      SUPERSET_PASSWORD: admin
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      PUSH_WEBHOOK_TOKEN: ${PUSH_WEBHOOK_TOKEN:-}
    volumes:
      - monitor_data:/app/data
    ports:
      - "${MONITOR_PORT_HOST:-18000}:8000"
    command: ["python", "-m", "semantic_monitor.cli", "serve", "--transport", "streamable-http"]

volumes:
  postgres_data:
  superset_home:
  monitor_data:
