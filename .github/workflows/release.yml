name: Native release

on:
  workflow_dispatch:
  push:
    branches: [feat/local-investigation-runtime]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: darwin-arm64}
          - {runner: macos-15-intel, target: darwin-x86_64}
          - {runner: ubuntu-22.04, target: linux-x86_64}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Resolve version (tags must match package metadata)
        id: version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = 'v' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version), 'Stable semver required'
          if os.environ['RELEASE_REF_TYPE'] == 'tag':
              assert os.environ['RELEASE_REF_NAME'] == version, 'Tag/package version mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Install locked build and test dependencies
        run: uv sync --locked --extra dev --extra binary
      - name: Check installer and packaging contracts
        run: uv run pytest tests/test_install.py -q
      - name: Verify source tree
        if: matrix.target == 'linux-x86_64'
        run: |
          uv run ruff check .
          uv run pytest
      - name: Build native executable
        run: uv run python scripts/build_binary.py
      - name: Smoke-test binary (no live API key or requests)
        run: uv run python scripts/check_binary.py
      - name: Package executable
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: uv run python scripts/package_release.py --version "$RELEASE_VERSION" --target "$RELEASE_TARGET"
      - name: Install the real binary through fixture HTTPS and initialize
        env:
          SIGNALWEAVE_TEST_BINARY: dist/signalweave
        run: uv run pytest tests/test_install.py -k real_binary -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    # Manual branch builds never publish, even if dispatched against a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Verify all archives and include installer
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -name '*.tar.gz' | wc -l)" -eq 3
          (cd release && sha256sum --check *.sha256)
          cp scripts/install.sh release/install.sh
          (cd release && sha256sum install.sh > install.sh.sha256 && cat *.sha256 > SHA256SUMS)
      - name: Attest published files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'release/*'
      - name: Publish new release (never overwrite an existing release or asset)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Listing includes authenticated drafts; network failures also stop publication.
          existing_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if printf '%s\n' "$existing_tags" | grep -Fxq -- "$RELEASE_TAG"; then
            echo 'Release already exists; refusing to modify it.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft \
            --title "SignalWeave $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
