name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run python -m pytest

  hosted-preset-proof:
    name: hosted Preset contract proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run no-credential hosted Preset proof pack
        run: |
          uv run python evaluations/preset_enterprise_proof.py \
            --output artifacts/preset-enterprise-proof.json
          uv run python evaluations/preset_enterprise_proof_review.py \
            artifacts/preset-enterprise-proof.json

      - name: Upload hosted Preset proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-preset-proof-${{ github.run_id }}
          path: artifacts/**/*.json
          if-no-files-found: ignore

  hosted-preset-scale-proof:
    name: hosted Preset scale proof (${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        seed: [2026092628, 2026092601, 2026092602, 2026092603]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run 33-workspace Preset-shaped replay
        run: |
          uv run python -m evaluations.preset_runtime_shadow_trial \
            --generated-workspaces 30 \
            --generated-charts-per-workspace 16 \
            --generated-seed "${{ matrix.seed }}" \
            --output "artifacts/preset-runtime-shadow-${{ matrix.seed }}.json"
          uv run python evaluations/preset_runtime_shadow_review.py \
            "artifacts/preset-runtime-shadow-${{ matrix.seed }}.json"

      - name: Upload scaled Preset proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-preset-scale-${{ matrix.seed }}-${{ github.run_id }}
          path: artifacts/preset-runtime-shadow-${{ matrix.seed }}.json
          if-no-files-found: ignore
