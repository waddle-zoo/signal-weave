name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run python -m pytest

  local-superset-chart-matrix:
    name: local Superset chart matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Start local Superset fixture
        shell: bash
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/typesafe_api_key"
          TYPESAFE_API_KEY_FILE="$RUNNER_TEMP/typesafe_api_key" \
            docker compose up -d --build superset

      - name: Wait for Superset health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8088/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps --all
          docker compose logs --tail=160 superset
          exit 1

      - name: Run every-chart matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          uv run python scripts/superset_chart_matrix.py \
            | tee artifacts/superset-chart-matrix.json

      - name: Run live Superset integration tests
        env:
          RUN_SUPERSET_INTEGRATION: "1"
        run: uv run pytest tests/test_superset_integration.py -q

      - name: Upload Superset matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-superset-chart-matrix-${{ github.run_id }}
          path: artifacts/superset-chart-matrix.json
          if-no-files-found: ignore

      - name: Tear down local Superset fixture
        if: always()
        shell: bash
        run: docker compose down -v

  hosted-preset-proof:
    name: hosted Preset contract proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run no-credential hosted Preset proof pack
        run: |
          uv run python evaluations/preset_enterprise_proof.py \
            --output artifacts/preset-enterprise-proof.json
          uv run python evaluations/preset_enterprise_proof_review.py \
            artifacts/preset-enterprise-proof.json

      - name: Upload hosted Preset proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-preset-proof-${{ github.run_id }}
          path: artifacts/**/*.json
          if-no-files-found: ignore

  hosted-preset-compose-contract:
    name: hosted Preset Compose contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run API-token Compose preflight
        run: |
          cp examples/preset/.env.preset.example .env.preset
          secret_dir="$(mktemp -d)"
          touch "$secret_dir/typesafe" "$secret_dir/preset-name" \
            "$secret_dir/preset-secret" "$secret_dir/signalweave" "$secret_dir/push"
          TYPESAFE_API_KEY_FILE="$secret_dir/typesafe" \
          PRESET_API_TOKEN_NAME_HOST_FILE="$secret_dir/preset-name" \
          PRESET_API_TOKEN_SECRET_HOST_FILE="$secret_dir/preset-secret" \
          SIGNALWEAVE_API_TOKEN_HOST_FILE="$secret_dir/signalweave" \
          PUSH_WEBHOOK_TOKEN_HOST_FILE="$secret_dir/push" \
            python3 scripts/preset_compose_check.py

      - name: Run bearer Compose preflight
        run: |
          secret_dir="$(mktemp -d)"
          touch "$secret_dir/typesafe" "$secret_dir/preset-access" \
            "$secret_dir/signalweave" "$secret_dir/push"
          PRESET_COMPOSE_AUTH_MODE=bearer \
          TYPESAFE_API_KEY_FILE="$secret_dir/typesafe" \
          PRESET_ACCESS_TOKEN_HOST_FILE="$secret_dir/preset-access" \
          SIGNALWEAVE_API_TOKEN_HOST_FILE="$secret_dir/signalweave" \
          PUSH_WEBHOOK_TOKEN_HOST_FILE="$secret_dir/push" \
            python3 scripts/preset_compose_check.py

  hosted-preset-bootstrap-contract:
    name: hosted Preset bootstrap contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Reject copied sample sentinels without network traffic
        shell: bash
        run: |
          set +e
          PRESET_URL='https://your-workspace.<region>.app.preset.io' \
          PRESET_WORKSPACE='your-workspace' \
          PRESET_TENANT_ID='your-company' \
          PRESET_API_TOKEN_NAME='replace-me' \
          PRESET_API_TOKEN_SECRET='replace-me' \
          SIGNALWEAVE_TENANT_ID='your-company' \
          SIGNALWEAVE_PRINCIPAL_ID='your-agent' \
          TYPESAFE_API_KEY='placeholder' \
            uv run python scripts/preset_config_check.py > /tmp/preset-config-sentinel.json 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q '"network_requests": 0' /tmp/preset-config-sentinel.json
          grep -q 'PRESET_URL' /tmp/preset-config-sentinel.json

      - name: Accept valid-shaped config without network traffic
        run: |
          PRESET_URL='https://northstar.us-east-1.app.preset.io' \
          PRESET_WORKSPACE='northstar' \
          PRESET_TENANT_ID='northstar' \
          PRESET_API_TOKEN_NAME='ci-name' \
          PRESET_API_TOKEN_SECRET='ci-secret' \
          SIGNALWEAVE_TENANT_ID='northstar' \
          SIGNALWEAVE_PRINCIPAL_ID='signalweave-agent' \
          TYPESAFE_API_KEY='ci-typesafe-key' \
            uv run python scripts/preset_config_check.py > /tmp/preset-config-valid.json
          grep -q '"passed": true' /tmp/preset-config-valid.json
          grep -q '"network_requests": 0' /tmp/preset-config-valid.json
          grep -q '"jev_requests": 0' /tmp/preset-config-valid.json

      - name: Reject contradictory cached policy without network traffic
        shell: bash
        run: |
          set +e
          PRESET_URL='https://northstar.us-east-1.app.preset.io' \
          PRESET_WORKSPACE='northstar' \
          PRESET_TENANT_ID='northstar' \
          PRESET_API_TOKEN_NAME='ci-name' \
          PRESET_API_TOKEN_SECRET='ci-secret' \
          PRESET_DATA_MODE='cached_results' \
          PRESET_ALLOW_REFRESH='true' \
          SIGNALWEAVE_TENANT_ID='northstar' \
          SIGNALWEAVE_PRINCIPAL_ID='signalweave-agent' \
          TYPESAFE_API_KEY='ci-typesafe-key' \
            uv run python scripts/preset_config_check.py > /tmp/preset-config-policy.json 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q '"network_requests": 0' /tmp/preset-config-policy.json
          grep -q 'requires live_query mode' /tmp/preset-config-policy.json

  hosted-preset-scale-proof:
    name: hosted Preset scale proof (${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        seed: [2026092628, 2026092601, 2026092602, 2026092603]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run 33-workspace Preset-shaped replay
        run: |
          uv run python -m evaluations.preset_runtime_shadow_trial \
            --generated-workspaces 30 \
            --generated-charts-per-workspace 16 \
            --generated-seed "${{ matrix.seed }}" \
            --output "artifacts/preset-runtime-shadow-${{ matrix.seed }}.json"
          uv run python evaluations/preset_runtime_shadow_review.py \
            "artifacts/preset-runtime-shadow-${{ matrix.seed }}.json"

      - name: Upload scaled Preset proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-preset-scale-${{ matrix.seed }}-${{ github.run_id }}
          path: artifacts/preset-runtime-shadow-${{ matrix.seed }}.json
          if-no-files-found: ignore
