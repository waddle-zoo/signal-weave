services:
  signal-weave:
    environment:
      # Select the Preset bearer mode and clear every API-token alternative.
      PRESET_ACCESS_TOKEN: ""
      PRESET_ACCESS_TOKEN_FILE: /run/secrets/preset_access_token
      PRESET_API_TOKEN_NAME: ""
      PRESET_API_TOKEN_SECRET: ""
      PRESET_API_TOKEN_NAME_FILE: ""
      PRESET_API_TOKEN_SECRET_FILE: ""
      SIGNALWEAVE_API_TOKEN: ""
      SIGNALWEAVE_API_TOKEN_FILE: /run/secrets/signalweave_api_token
      PUSH_WEBHOOK_TOKEN: ""
      PUSH_WEBHOOK_TOKEN_FILE: /run/secrets/push_webhook_token
    secrets:
      - preset_access_token
      - signalweave_api_token
      - push_webhook_token

secrets:
  preset_access_token:
    file: ${PRESET_ACCESS_TOKEN_HOST_FILE:?Set PRESET_ACCESS_TOKEN_HOST_FILE to the mounted secret path}
  signalweave_api_token:
    file: ${SIGNALWEAVE_API_TOKEN_HOST_FILE:?Set SIGNALWEAVE_API_TOKEN_HOST_FILE to the mounted secret path}
  push_webhook_token:
    file: ${PUSH_WEBHOOK_TOKEN_HOST_FILE:?Set PUSH_WEBHOOK_TOKEN_HOST_FILE to the mounted secret path}
